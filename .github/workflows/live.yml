name: live
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet run --project examples/Generate
      - run: dotnet pack src/Veida -c Release -o out
      - name: publish to nuget.org
        if: github.ref == 'refs/tags/v0.1.0'
        run: dotnet nuget push out/*.nupkg --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
